[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amzleak"
version = "0.1.0"
description = "亚马逊报表本地漏损审计 CLI：结算、库龄、搜索词三表合并总账"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "amzleak contributors" }]
keywords = ["amazon", "audit", "settlement", "inventory", "ppc", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
test = ["pytest>=8"]

[project.scripts]
amzleak = "amzleak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amzleak"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/amzleak",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
